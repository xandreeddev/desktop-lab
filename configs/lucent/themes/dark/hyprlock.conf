# Emergency secure locker; generated from Lucent tokens.
general {
  ignore_empty_input = true
}
background {
  monitor =
  path = ~/.local/state/lucent/wallpaper
  color = rgb(2c5184)
  blur_passes = 0
}
input-field {
  monitor =
  size = 320, 48
  rounding = 18
  inner_color = rgb(2c5184)
  outer_color = rgb(73dcee)
  font_color = rgb(bce8f4)
  fail_color = rgb(ffcfbc)
  placeholder_text = Password
  halign = center
  valign = center
}
