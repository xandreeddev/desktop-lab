# Emergency secure locker; generated from Lucent tokens.
general {
  ignore_empty_input = true
}
background {
  monitor =
  path = ~/.local/state/lucent/wallpaper
  color = rgb(badbea)
  blur_passes = 0
}
input-field {
  monitor =
  size = 320, 48
  rounding = 18
  inner_color = rgb(badbea)
  outer_color = rgb(176075)
  font_color = rgb(17334b)
  fail_color = rgb(9c2e16)
  placeholder_text = Password
  halign = center
  valign = center
}
