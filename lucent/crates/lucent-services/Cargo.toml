[package]
name = "lucent-services"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
# Test-only private media-stage probe; never part of the normal library/runtime.
video-stage-benchmark = []

[dependencies]
lucent-domain = { path = "../lucent-domain" }
lucent-api = { path = "../lucent-api" }
serde_json = "1"
serde = "1"
libc = "0.2"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.45"
zbus = "5.19"
async-channel = "2.5"
# 1.14.0 can free executor state while a reactor waker still schedules work.
# Keep the prior release until a fixed version of upstream issue #163 ships.
# https://github.com/smol-rs/async-executor/issues/163
async-executor = "=1.13.3"
async-io = "2.6"
futures-lite = "2.6"
lucent-usecases = { path = "../lucent-usecases" }
jpeg-decoder = { version = "0.3.2", default-features = false }
pulse = { version = "1.23.0", package = "libpulse-sys" }

ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
