name: checks
on:
  push:
    branches-ignore: [ci/lucent-arch-release-video-focus]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: node --test tests/component-lab.test.mjs
      - run: npm run check
      - run: npm run build
      - run: python3 scripts/check-build.py
      - name: Check project Pages URLs
        env:
          SITE_BASE_PATH: /desktop-lab
        run: |
          npm run build
          python3 scripts/check-build.py
  integration-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate-design-tokens.py --check
      - run: python3 scripts/generate-app-icons.py --check
      - run: python3 scripts/check-component-lab.py
      - run: python3 -m unittest discover -s tests -v
      - run: shellcheck scripts/*.sh configs/lucid/*.sh
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        timeout-minutes: 10
        run: |
          # Skip the slow Azure mirror without changing Ubuntu release or signing policy.
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re

          sources = [path for path in (Path("/etc/apt/sources.list.d/ubuntu.sources"), Path("/etc/apt/sources.list")) if path.exists()]
          assert sources and all(path.is_file() and not path.is_symlink() for path in sources), "Expected regular Ubuntu APT sources"
          mirror = Path("/etc/apt/apt-mirrors.txt")
          reference = "mirror+file:/etc/apt/apt-mirrors.txt"
          if any(reference in line.split() for path in sources for line in path.read_text().splitlines() if not line.lstrip().startswith("#")):
              assert mirror.is_file() and not mirror.is_symlink(), "Expected runner mirror list"
              lines = mirror.read_text().splitlines(keepends=True)
              entries = [tuple(line.split()) for line in lines if line.strip() and not line.lstrip().startswith("#")]
              expected = {("http://azure.archive.ubuntu.com/ubuntu/", "priority:1"),
                          ("https://archive.ubuntu.com/ubuntu/", "priority:2"),
                          ("https://security.ubuntu.com/ubuntu/", "priority:3")}
              assert len(entries) == 3 and set(entries) == expected, "Unexpected runner mirror layout"
              updates = {mirror: "".join(line for line in lines if tuple(line.split()) != ("http://azure.archive.ubuntu.com/ubuntu/", "priority:1"))}
          else:
              azure = re.compile(r"(?<!\S)http://azure\.archive\.ubuntu\.com/ubuntu/?(?=\s|$)")
              updates = {}
              for path in sources:
                  before = path.read_text()
                  after = "".join(line if line.lstrip().startswith("#") else azure.sub("https://archive.ubuntu.com/ubuntu/", line) for line in before.splitlines(keepends=True))
                  if after != before:
                      updates[path] = after
              assert updates, "Expected known Azure Ubuntu source; refusing a silent no-op"
          for path, contents in updates.items():
              path.write_text(contents)
          print("Ubuntu HTTPS archive selected; security endpoint, suites, components and signing keys preserved")
          PYTHON
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 update &&
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 install -y libwayland-dev libxkbcommon-dev pkg-config mesa-vulkan-drivers libpam0g-dev libpolkit-agent-1-dev libclang-dev dbus libpulse-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev ffmpeg pipewire pipewire-pulse pipewire-bin pulseaudio-utils
      - run: rustup update stable && rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path lucent/Cargo.toml --all --check
      - run: cargo clippy --manifest-path lucent/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path lucent/Cargo.toml --locked --workspace
      - run: dbus-run-session -- cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services notification_ -- --ignored
      - run: cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services audio_protocol -- --ignored
      - run: cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services bluetooth_protocol -- --ignored
      - run: cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services power_protocol -- --ignored
      - run: cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services tray_protocol -- --ignored
      - run: cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services media_protocol -- --ignored
      - name: Native Vulkan visual regressions
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render frozen_stream_snapshot_keeps_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render trace_reports_final_bound_alias -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render international_style_masks -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render wrapped_bidi -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render streamed_images_reuse -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render snapshot_rejects_invalid_extents -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render scene_rejection_preserves -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render opaque_images_retain_coverage -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render alpha_masks_match_rgba -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render frame_profiling_distinguishes -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render renderer_surface_resources -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render edge_coverage_is_mirror_symmetric -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render slider_track_thumb_and_focus -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render scroll_viewport_thumb_and_focus -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render rounded_cover_and_nested_clips -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render diagonal_reveal_preserves_rounded_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render trimmed_cover_preserves_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render shadow_blur_is_supplied -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-desktop compact_dock_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-desktop background_coverage_optimization -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-desktop bounded_widget_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-desktop --bin lucent-desktop bar_handoff_carriers_keep_identical_pixels -- --ignored --nocapture --test-threads=1
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-desktop visual_regressions -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-visual-report
          path: reports/local/visual-tests
          if-no-files-found: ignore
