name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python3 scripts/check-build.py
      - name: Check project Pages URLs
        env:
          SITE_BASE_PATH: /desktop-lab
        run: |
          npm run build
          python3 scripts/check-build.py
  integration-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate-design-tokens.py --check
      - run: python3 scripts/generate-app-icons.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: shellcheck scripts/*.sh configs/lucid/*.sh
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config mesa-vulkan-drivers libpam0g-dev libpolkit-agent-1-dev libclang-dev dbus libpulse-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev ffmpeg pipewire pipewire-pulse pipewire-bin pulseaudio-utils
      - run: rustup update stable && rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path lucent/Cargo.toml --all --check
      - run: cargo clippy --manifest-path lucent/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path lucent/Cargo.toml --locked --workspace
      - run: dbus-run-session -- cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services notification_ -- --ignored
      - run: cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services audio_protocol -- --ignored
      - run: cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services bluetooth_protocol -- --ignored
      - run: cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services power_protocol -- --ignored
      - run: cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-services tray_protocol -- --ignored
      - name: Native Vulkan visual regressions
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render frozen_stream_snapshot_keeps_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render streamed_images_reuse -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render snapshot_rejects_invalid_extents -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render scene_rejection_preserves -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render opaque_images_retain_coverage -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render alpha_masks_match_rgba -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render frame_profiling_distinguishes -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render renderer_surface_resources -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render edge_coverage_is_mirror_symmetric -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render slider_track_thumb_and_focus -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render scroll_viewport_thumb_and_focus -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render rounded_cover_and_nested_clips -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render diagonal_reveal_preserves_rounded_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render trimmed_cover_preserves_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-render shadow_blur_is_supplied -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-desktop compact_dock_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-desktop background_coverage_optimization -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-desktop bounded_widget_pixels -- --ignored --nocapture
          cargo test --manifest-path lucent/Cargo.toml --locked -p lucent-desktop visual_regressions -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-visual-report
          path: reports/local/visual-tests
          if-no-files-found: ignore
