name: source-b2 Arch release

on:
  push:
    branches: [ci/lucent-arch-release-b2]

permissions:
  contents: read

concurrency:
  group: arch-release-b2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arch-release:
    if: >-
      github.repository == 'xandreeddev/desktop-lab' &&
      github.actor == 'xandreeddev' && github.triggering_actor == 'xandreeddev'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      # Official base-devel-20261018.0.612668, Linux/amd64 manifest.
      image: docker.io/library/archlinux@sha256:2acfa2683d458b7803b7aa4ee3c139d2ba6922cd84666fcb7496a3a02fcc4c83
      options: --cpus 3 --memory 10g --memory-swap 10g --pids-limit 1024
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    env:
      LUCENT_CI_IMAGE: docker.io/library/archlinux@sha256:2acfa2683d458b7803b7aa4ee3c139d2ba6922cd84666fcb7496a3a02fcc4c83
      LUCENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: never
    steps:
      - name: Admit remote budget and freeze one signed Arch package transaction
        timeout-minutes: 15
        run: |
          proof="$RUNNER_TEMP/arch-dependencies"
          mkdir -p "$proof/cache" "$proof/databases" "$RUNNER_TEMP/arch-artifacts"
          test "$(cat /sys/fs/cgroup/memory.max)" = 10737418240
          test "$(cat /sys/fs/cgroup/cpu.max)" = '300000 100000'
          test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
          for sample in 1 2 3; do
            host_mib=$(awk '/^MemAvailable:/ {print int($2 / 1024)}' /proc/meminfo)
            current=$(cat /sys/fs/cgroup/memory.current)
            remaining_mib=$(( (10737418240 - current) / 1048576 ))
            effective=$host_mib
            if (( remaining_mib < effective )); then effective=$remaining_mib; fi
            test "$effective" -ge 4500
            printf '%s\n' "$effective" >> "$proof/bootstrap-admission.txt"
            sleep 1
          done
          packages=(base-devel git python rustup clang llvm pkgconf wayland libxkbcommon pam polkit libpulse ffmpeg vulkan-icd-loader vulkan-swrast vulkan-tools dbus fontconfig ttf-dejavu noto-fonts zstd)
          # Download once, then install from the same frozen sync databases.
          # The default required package signature policy is retained.
          pacman-conf SigLevel > "$proof/signature-policy.txt"
          grep -qw PackageRequired "$proof/signature-policy.txt"
          pacman -Syuw --noconfirm --cachedir "$proof/cache" "${packages[@]}" > "$proof/download.log" 2>&1
          sha256sum /var/lib/pacman/sync/*.db > "$proof/databases.sha256"
          cp /var/lib/pacman/sync/*.db "$proof/databases/"
          pacman -Sup --print-format '%l' "${packages[@]}" > "$proof/resolved-urls.txt"
          find "$proof/cache" -type f -name '*.pkg.tar.*' ! -name '*.sig' -print0 | sort -z | xargs -0 -r sha256sum > "$proof/archives.sha256"
          test -s "$proof/archives.sha256"
          pacman -Su --noconfirm --cachedir "$proof/cache" "${packages[@]}" > "$proof/install.log" 2>&1
          sha256sum --check "$proof/databases.sha256"
          sha256sum --check "$proof/archives.sha256"
          pacman -Q > "$proof/installed-packages.txt"

      - name: Checkout reviewed workflow tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact reviewed application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b2f54551dfbe3744762e04b06cc9abcdfd167eaa
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact Rust toolchain
        timeout-minutes: 10
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy

      - name: Run coherent source-b2 seventeen-stage release qualification
        timeout-minutes: 90
        run: |
          python3 tools/ci/arch_release.py --run \
            --source-directory "$GITHUB_WORKSPACE/source" \
            --target-directory "$RUNNER_TEMP/lucent-target-b2" \
            --output "$RUNNER_TEMP/arch-artifacts/lucent-b2" \
            --dependency-evidence "$RUNNER_TEMP/arch-dependencies"

      - name: Retain coherent archive and portable receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lucent-arch-b2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/arch-artifacts/lucent-b2.tar.zst
            ${{ runner.temp }}/arch-artifacts/artifact-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

      - name: Retain bounded build diagnostics when qualification fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lucent-arch-b2-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/arch-artifacts/lucent-b2/build.json
            ${{ runner.temp }}/arch-artifacts/lucent-b2/logs/*.log
            ${{ runner.temp }}/arch-artifacts/lucent-b2/dependency-fetch.log
            ${{ runner.temp }}/arch-dependencies/download.log
            ${{ runner.temp }}/arch-dependencies/install.log
          if-no-files-found: warn
          retention-days: 1
          overwrite: false
